# ==============================================================================
# Generic Dataset Configuration Template (for plugging in future datasets)
# ==============================================================================
dataset_name: "generic_fraud_dataset"
adapter_type: "generic"
raw_csv_path: "archive/custom_dataset.csv"

schema:
  target_col: "is_fraud"
  numeric_cols:
    - "amount"
    - "feature_1"
    - "feature_2"
  categorical_cols:
    - "category"
  drop_cols:
    - "transaction_id"

remediation:
  valid_fraud_types: null
  fix_ledger_bug: false
  sample_negative_count: 300000
  random_seed: 42

modeling:
  test_size: 0.25
  random_seed: 42
  cost_false_negative: 500.0
  cost_false_positive: 10.0
  xgboost_params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.08
    eval_metric: "aucpr"
    random_state: 42
    n_jobs: -1
  secondary_model_type: "lightgbm"
  lightgbm_params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.08
    random_state: 42
    n_jobs: -1
    verbose: -1

explainability:
  num_background_samples: 200
  num_test_samples_global: 300
  num_case_studies: 5
  random_seed: 42

paths:
  audit_dir: "data/01_audit"
  modeling_dir: "data/02_modeling"
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
